"src.query.retrieval.vector".msg = "改用 src.query.retrieval 导入"
"src.query.retrieval.bm25".msg = "改用 src.query.retrieval 导入"
"src.query.retrieval.base".msg = "改用 src.query.retrieval 导入"
"src.query.retrieval.boosting".msg = "改用 src.query.retrieval 导入"
"src.query.generation.generator".msg = "改用 src.query.generation 导入"
"src.query.generation.prompt".msg = "改用 src.query.generation 导入"
"src.query.generation.prompt_builder".msg = "改用 src.query.generation 导入"
"src.query.generation.warnings".msg = "改用 src.query.generation 导入"
"src.query.reranker.cross_encoder".msg = "改用 src.query.reranker 导入"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
