[project]
name = "medical-rag"
version = "1.0.0"
description = "Medical Knowledge Base RAG Q&A System"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi[standard]>=0.136.0",
    "uvicorn[standard]>=0.46.0",
    "python-multipart>=0.0.27",
    # Data validation
    "pydantic>=2.13.0",
    "pydantic-settings>=2.10.0",
    # Database
    "sqlalchemy>=2.0.44",
    "asyncpg>=0.30.0",
    "alembic>=1.16.5",
    # Vector database
    "qdrant-client>=1.17.0",
    # Redis (with built-in asyncio support, replaces aioredis)
    "redis>=6.1.0",
    # Embedding & Reranker
    "sentence-transformers>=5.4.0",
    "torch>=2.11.0",
    "FlagEmbedding>=1.3.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    # LLM
    "openai>=2.16.0",
    # Document parsing
    "pymupdf4llm>=1.27.2.3",
    "pymupdf>=1.27.2.3",
    "python-docx>=1.2.0",
    "markdown>=3.10.2",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.0.1",
    # Configuration
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.2",
    # Utilities
    "python-jose[cryptography]>=3.5.0",
    "libpass>=1.7.5",          # maintained fork of deprecated passlib
    "httpx>=0.28.1",
    "tenacity>=9.1.4",
    "tiktoken>=0.12.0",
    # Streamlit
    "streamlit>=1.57.0",
    "streamlit-option-menu>=0.3.12",
    # Testing
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "httpx>=0.28.1",
    # Logging
    "loguru>=0.7.3",
    # Observability
    "prometheus-client>=0.25.0",
    "slowapi>=0.1.9",
    "plotly>=6.8.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["src*", "frontend*"]
exclude = ["tests*", "scripts*"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "I",   # isort 导入排序
    "F",   # pyflakes 基础错误
    "E",   # pycodestyle 错误
    "W",   # pycodestyle 警告
    "UP",  # pyupgrade 现代化语法
    "N",   # pep8-naming 命名规范
    "TID", # flake8-tidy-imports（禁止绕过 __init__.py 的内部导入）
]
extend-ignore = [
    "N802",      # 允许函数名含大写（Pydantic validators 需大写）
]

# ========== 模块边界约束：禁止绕过 __init__.py 导入内部模块 ==========
# 规则：其他模块必须通过对应的 __init__.py 导入公开 API，
#       而非直接导入内部实现文件。
# 例外：__init__.py 自身需要导入内部模块以重导出，已在 per-file-ignores 中豁免。
[tool.ruff.lint.per-file-ignores]
"src/*/__init__.py" = ["TID251"]
"src/common/config/__init__.py" = ["TID251"]
"src/common/__init__.py" = ["TID251"]
"src/common/config/settings.py" = ["TID251"]
"src/common/safety/checker.py" = ["TID251"]
"src/common/database/engine.py" = ["TID251"]
"src/common/database/models.py" = ["TID251"]
"src/common/cache/manager.py" = ["TID251"]
"src/common/logging/setup.py" = ["TID251"]
"src/common/monitoring/metrics.py" = ["TID251"]
"src/common/monitoring/api.py" = ["TID251"]
"src/common/di/container.py" = ["TID251"]
"src/common/di/deps.py" = ["TID251"]
"src/conversation/manager.py" = ["TID251"]
"src/conversation/consistency.py" = ["TID251"]
"src/documents/chunker.py" = ["TID251"]
"src/documents/parser.py" = ["TID251"]
"src/documents/processor.py" = ["TID251"]
"src/documents/indexer.py" = ["TID251"]
"src/documents/service.py" = ["TID251"]
"src/documents/store.py" = ["TID251"]
"src/query/engine.py" = ["TID251"]
"src/query/generation/generator.py" = ["TID251"]
"src/query/generation/prompt.py" = ["TID251"]
"src/query/generation/prompt_builder.py" = ["TID251"]
"src/query/generation/warnings.py" = ["TID251"]
"src/query/reranker/cross_encoder.py" = ["TID251"]
"src/query/retrieval/hybrid.py" = ["TID251"]
"src/query/retrieval/vector.py" = ["TID251"]
"src/query/retrieval/bm25.py" = ["TID251"]
"src/query/retrieval/base.py" = ["TID251"]
"src/query/retrieval/boosting.py" = ["TID251"]
"src/query/citation/verifier.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# ======== docs common ========
"src.common.config.settings".msg = "改用 src.common.config 导入"
"src.common.database.engine".msg = "改用 src.common.database 导入"
"src.common.database.models".msg = "改用 src.common.database 导入"
"src.common.cache.manager".msg = "改用 src.common.cache 导入"
"src.common.logging.setup".msg = "改用 src.common.logging 导入"
"src.common.monitoring.metrics".msg = "改用 src.common.monitoring 导入"
"src.common.monitoring.api".msg = "改用 src.common.monitoring 导入"
"src.common.di.container".msg = "改用 src.common.di 导入"
"src.common.di.deps".msg = "改用 src.common.di 导入"
"src.common.safety.checker".msg = "改用 src.common.safety 导入"

# ======== docs documents ========
"src.documents.chunker".msg = "改用 src.documents 导入"
"src.documents.parser".msg = "改用 src.documents 导入"
"src.documents.processor".msg = "改用 src.documents 导入"
"src.documents.indexer".msg = "改用 src.documents 导入"
"src.documents.service".msg = "改用 src.documents 导入"
"src.documents.store".msg = "改用 src.documents 导入"

# ======== docs conversation ========
"src.conversation.manager".msg = "改用 src.conversation 导入"
